[project]
name = "global-ai-investor-backend"
version = "0.1.0"
description = "Global AI Investor V1.0 backend sidecar (China A-share)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1",
  "pandas>=3.0",
  "numpy>=2.5",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",
  "requests>=2.34",
  "apscheduler>=3.11",
  "tenacity>=9.2",
  "python-dotenv>=1.2",
  "openpyxl>=3.1",
  "pywin32>=312",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "pyinstaller>=6.22"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
